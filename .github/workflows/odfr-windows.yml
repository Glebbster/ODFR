name: ODFR Windows

on:
  pull_request:
  workflow_dispatch:
    inputs:
      repeat:
        description: Required consecutive passes per test
        type: choice
        options:
          - '1'
          - '3'
          - '10'
        default: '3'

permissions:
  contents: read

jobs:
  test:
    name: Windows x64 serial and MS-MPI
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        id: msys2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-msmpi
            mingw-w64-ucrt-x86_64-python
      - uses: mpi4py/setup-mpi@3417e34f1394a16723d7913c236642c24e95fd5a # v1
        with:
          mpi: msmpi
      - name: Build and test ODFR
        shell: pwsh
        env:
          TOOLCHAIN_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          STABILITY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          TEST_REPEATS: ${{ inputs.repeat || '1' }}
        run: |
          $bin = Join-Path $env:TOOLCHAIN_ROOT 'ucrt64\bin'
          & ./platforms/windows/verify.ps1 -ToolchainBin $bin -BuildDir (Join-Path $env:RUNNER_TEMP 'odfr') -Repeat ([int]$env:TEST_REPEATS) -Stability:($env:STABILITY_RUN -eq 'true')
